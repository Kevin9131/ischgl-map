name: Lift & piste status

on:
  schedule:
    # every 15 minutes, 06:00–16:45 UTC (07:00–17:45 Ischgl winter time), Nov–May
    - cron: "*/15 6-16 * 11,12,1,2,3,4,5 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lift-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python fetch_status.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain status.json)" ]; then
            git config user.name "lift-status bot"
            git config user.email "actions@users.noreply.github.com"
            git add status.json
            git commit -m "Lift status $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
